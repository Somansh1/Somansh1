name: observatory
on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches: [master]
    paths: ["scripts/**", "fonts/**"]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools
      - run: python scripts/build.py
        env:
          # GITHUB_TOKEN only sees public contributions, so the nightly total could undercount.
          # Add an optional personal token as the PROFILE_TOKEN secret to match a local build.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the sky changed
        run: |
          git add assets data
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git config user.name "observatory-bot"
          git config user.email "observatory-bot@users.noreply.github.com"
          git commit -m "chore: redraw the sky"
          git pull --rebase
          git push
